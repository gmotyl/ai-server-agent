<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c0a09">
<title>ai-server-agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Login -->
<div id="login" class="login-screen">
  <div class="login-grain"></div>
  <div class="login-card">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <rect x="4" y="4" width="40" height="40" rx="8" stroke="var(--lime)" stroke-width="2.5" fill="none"/>
        <circle cx="18" cy="20" r="3" fill="var(--lime)"/>
        <circle cx="30" cy="20" r="3" fill="var(--lime)"/>
        <path d="M16 30 Q24 36 32 30" stroke="var(--lime)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        <rect x="20" y="2" width="8" height="6" rx="2" fill="var(--surface-2)" stroke="var(--lime)" stroke-width="1.5"/>
      </svg>
    </div>
    <h1 class="login-title">ai-server-agent</h1>
    <p class="login-sub">Operations Console</p>
    <div id="login-error" class="login-error">Invalid token. Try again.</div>
    <div class="login-field">
      <label for="token-input">Access Token</label>
      <input type="password" id="token-input" placeholder="Enter token" autocomplete="off" spellcheck="false" autofocus>
    </div>
    <button class="btn-primary login-btn" onclick="doLogin()">
      <span>Authenticate</span>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</div>

<!-- App -->
<div id="app" class="app">
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <rect x="4" y="4" width="40" height="40" rx="8" stroke="var(--lime)" stroke-width="2.5" fill="none"/>
          <circle cx="18" cy="20" r="3" fill="var(--lime)"/>
          <circle cx="30" cy="20" r="3" fill="var(--lime)"/>
          <path d="M16 30 Q24 36 32 30" stroke="var(--lime)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <span class="topbar-title">agent<span class="topbar-title-dot">.</span>ctrl</span>
    </div>
    <div class="topbar-right">
      <div class="status-pill" id="header-status">
        <span class="status-dot"></span>
        <span id="header-provider"></span>
      </div>
      <button class="btn-ghost btn-sm" onclick="doLogout()">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 2H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2M11 11l3-3-3-3M6 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <nav class="tab-bar">
    <button class="tab active" data-tab="topics">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4z" stroke="currentColor" stroke-width="1.3"/><path d="M5 6h6M5 8.5h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Topics</span>
    </button>
    <button class="tab" data-tab="schedules">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3.5l2.5 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Schedules</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>
  </nav>

  <main class="main">
    <!-- Topics Tab -->
    <section id="tab-topics" class="panel active">
      <div class="panel-header">
        <h2>Topic History</h2>
        <button class="btn-ghost btn-sm" onclick="loadTopics()" title="Refresh">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 0 1 10.3-4.2M14 2v4h-4M14 8a6 6 0 0 1-10.3 4.2M2 14v-4h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="topics-list" class="card-list"></div>
      <div class="panel-footer">
        <button class="btn-danger btn-sm" onclick="deleteClosedTopics()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M5.33 4V2.67a1.33 1.33 0 0 1 1.34-1.34h2.66a1.33 1.33 0 0 1 1.34 1.34V4M12 4v9.33a1.33 1.33 0 0 1-1.33 1.34H5.33A1.33 1.33 0 0 1 4 13.33V4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Purge closed</span>
        </button>
      </div>
    </section>

    <!-- Schedules Tab -->
    <section id="tab-schedules" class="panel">
      <div class="panel-header">
        <h2>Scheduler</h2>
        <button class="btn-primary btn-sm" onclick="showAddSchedule()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <span>New Task</span>
        </button>
      </div>
      <div id="heartbeat-note" class="info-bar"></div>
      <div id="schedules-list" class="card-list"></div>
      <div id="schedule-form-area"></div>
    </section>

    <!-- Settings Tab -->
    <section id="tab-settings" class="panel">
      <div class="panel-header">
        <h2>Settings</h2>
      </div>
      <div id="settings-area" class="settings-wrap"></div>
    </section>
  </main>
</div>

<div id="toast" class="toast"></div>

<script src="/app.js"></script>
</body>
</html>
