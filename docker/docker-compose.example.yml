services:
  ai-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ai-server-agent
    # Container Station restarts unless-stopped containers after volume mounts on boot
    # — that's the reboot-proof autostart (no host cron / su / autorun needed).
    # Panel runs in-container so ports must be mapped; init:true reaps provider
    # grandchild processes so no zombies accumulate in the long-running container.
    command: ["./start.sh"]
    working_dir: /git/ai-server-agent
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    volumes:
      - ${GIT_DIR:-/your/git/dir}:/git
      - ${AGENT_HOME:-/your/agent/home}:/git/ai-server-agent
      - agent-home:/home/agent
      - /your/home/.ssh:/home/agent/.ssh:ro
      - ${AGENT_HOME:-/your/agent/home}/memory:/memory
    ports:
      - "${PANEL_PORT:-3000}:${PANEL_PORT:-3000}"
    network_mode: bridge

volumes:
  agent-home:
    name: ai-server-agent-home
